<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony Parsons — the catalogue</title>
<!-- GA4: copy the analytics tag block from the current index.html here before cutover -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{--linen:#FAF7F0;--mount:#FFFEFA;--ink:#232323;--soft:#6B655B;--teal:#6FA8A1;--hair:#E7E1D3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--linen);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
    font-size:17px;line-height:1.65}
  .page{max-width:620px;margin:0 auto;padding:34px 22px 80px}
  .mark{text-align:center;margin-bottom:36px}
  .mark a{display:inline-block;background:var(--teal);color:#FDFCF8;text-decoration:none;
    font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;font-size:12px;
    letter-spacing:.34em;padding:10px 16px 10px 20px}
  .plinth{background:var(--mount);padding:26px 26px 22px;
    box-shadow:0 1px 0 var(--teal), 0 14px 34px rgba(35,35,35,.09)}
  .plinth img{width:100%;display:block}
  .label{margin-top:44px;max-width:46ch}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic;
    font-size:40px;line-height:1.1}
  .story{margin-top:14px;color:var(--soft);font-size:17px}
  .meta{margin-top:20px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;
    font-size:13.5px;letter-spacing:.06em;color:var(--soft);line-height:1.8}
  .price{margin-top:18px;font-size:19px}
  .doors{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px}
  .doors a,.doors button{display:inline-block;padding:13px 24px;text-decoration:none;
    font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;font-size:14px;
    letter-spacing:.05em;color:var(--ink);border:1px solid var(--teal);background:none;cursor:pointer}
  .doors .quiet{border-color:var(--hair);color:var(--soft)}
  .doors a:hover,.doors button:hover{background:#F2EDE1}
  .rule{border:0;border-top:1px solid var(--hair);margin:52px 0 46px}
  .plate2{background:var(--mount);padding:26px;box-shadow:0 1px 0 var(--teal)}
  .plate2 img,.plate2 video{width:100%;display:block}
  .cap{margin-top:16px;color:var(--soft);font-size:15px;font-style:italic}
  .nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
  .nav a{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);min-width:0}
  .nav img{width:84px;display:block;box-shadow:0 1px 0 var(--teal);flex:0 0 auto}
  .nav .t{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:19px;line-height:1.2}
  .nav .s{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;font-size:12px;
    letter-spacing:.06em;color:var(--soft)}
  a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<div class="page">
  <div class="mark"><a href="gallery-v2.html">TONY / PARSONS</a></div>
  <div id="lot"></div>
</div>

<script>
const ARTIST_WA="447880601709";
const TRACKER="https://script.google.com/macros/s/AKfycbyat7BaffKYZXnznmS9BH9j9vjYSnxo2Yl3TY1egWuBE_hFSJ4Gr86N8lxYSm6kiP8sjA/exec";
const params=new URLSearchParams(location.search);
const slug=(params.get('p')||'').trim();
const who=(params.get('w')||'').trim();

function ping(event,page,geo){
  geo=geo||{};let visits=0;const key='seen-'+page+'-'+(who||'site');
  try{visits=parseInt(localStorage.getItem(key)||'0');
    if(event==='viewed'){visits++;localStorage.setItem(key,String(visits));}}catch(e){}
  const q=new URLSearchParams({event:event||'',page:page||'',who:who||'site',code:who||'site',
    region:geo.region||'',ip:geo.ip||'',isp:geo.isp||'',ua:navigator.userAgent||'',
    tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'',lang:navigator.language||'',
    ref:document.referrer||'direct',visits:String(visits)});
  const i=new Image(); i.src=TRACKER+'?'+q.toString();
}
let GEO={};
async function geoThenPing(){
  try{const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),2500);
    const r=await fetch('https://ipwho.is/',{signal:ctrl.signal});const j=await r.json();
    if(j&&j.success!==false)GEO={ip:j.ip,region:[j.city,j.region,j.country].filter(Boolean).join(', '),
      isp:(j.connection&&j.connection.isp)||''};}catch(e){}
  if(slug)ping('viewed',slug,GEO);
}

fetch('paintings.json').then(r=>r.json()).then(list=>{
  const i=list.findIndex(p=>p.id===slug);
  const p=i>=0?list[i]:null;
  const root=document.getElementById('lot');
  if(!p){root.innerHTML='<p style="text-align:center;color:var(--soft)">That painting has left the catalogue — <a href="gallery-v2.html">back to the wall</a>.</p>';return;}
  document.title=p.title+' — Tony Parsons';
  const wa=t=>'https://wa.me/'+ARTIST_WA+'?text='+encodeURIComponent(t);
  let doors='';
  if(!p.sold){
    doors+= p.pay
      ? '<a href="'+esc(p.pay)+'">Take it home'+(p.price?' — '+esc(p.price):'')+'</a>'
      : '<a href="'+wa("Hi Tony — I'd like to take "+p.title+" home. What happens next?")+'">Take it home'+(p.price?' — '+esc(p.price):'')+'</a>';
    doors+='<button type="button" id="wish" class="quiet">Add to my wishlist</button>';
  }
  doors+='<a class="quiet" href="'+wa('Hi Tony — about '+p.title+'…')+'">Ask Tony about this painting</a>';
  root.innerHTML=
    '<figure class="plinth"><img src="'+esc(p.img)+'" alt="'+esc(p.title)+' — oil painting by Tony Parsons"></figure>'+
    '<div class="label"><h1>'+esc(p.title)+'</h1>'+
    (p.story?'<p class="story">'+esc(p.story)+'</p>':'')+
    '<p class="meta">'+esc(p.size||'')+'<br>Painted on the spot, in one sitting</p>'+
    '<p class="price">'+(p.sold?'Sold':esc(p.price||''))+'</p>'+
    '<div class="doors">'+doors+'</div></div>'+
    (p.easel?'<hr class="rule"><div class="plate2"><img loading="lazy" src="'+esc(p.easel)+'" alt="On the easel"></div><p class="cap">At the easel — the morning it was made.</p>':'')+
    '<hr class="rule"><div class="nav">'+navEl(list,i-1,'Previous')+navEl(list,i+1,'Next')+'</div>';
  const w=document.getElementById('wish');
  if(w)w.addEventListener('click',()=>{ping('wishlist',slug,GEO);
    window.open(wa('Hi Tony — add me to the wishlist for '+p.title+' please.'),'_blank');});
  geoThenPing();
}).catch(()=>{});

function navEl(list,i,label){
  if(i<0||i>=list.length)return '<span></span>';
  const p=list[i];
  return '<a href="painting-v2.html?p='+encodeURIComponent(p.id)+'">'+
    '<img loading="lazy" src="'+esc(p.img)+'" alt=""><span><span class="s">'+label+'</span><br>'+
    '<span class="t">'+esc(p.title)+'</span></span></a>';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
