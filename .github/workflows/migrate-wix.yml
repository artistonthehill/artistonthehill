          fetch "palma-yachts" "https://static.wixstatic.com/media/9dfbf6_2320d392278149c983f491f02ce42154~mv2.jpg/v1/fit/w_1920,h_1440,al_c,q_90/9dfbf6_2320d392278149c983f491f02ce42154~mv2.jpg"
          fetch "peace-bruvver" "https://static.wixstatic.com/media/9dfbf6_fc1dfdb941ef4d68b35921315fa0f0d4~mv2.jpg/v1/fit/w_1920,h_1440,al_c,q_90/9dfbf6_fc1dfdb941ef4d68b35921315fa0f0d4~mv2.jpg"
