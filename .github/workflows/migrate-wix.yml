name: Migrate Wix images home
# One-shot: downloads the 42 paintings still hosted on Wix into images/,
# so the site and spine stop depending on the old Wix account.
# Run it from the Actions tab ("Run workflow"). Safe to re-run; it skips files
# that already exist.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download from Wix
        run: |
          set -e
          ok=0; skip=0; fail=0
          fetch() {
            slug="$1"; url="$2"; out="images/$slug.jpg"
            if [ -f "$out" ]; then echo "skip  $out (exists)"; skip=$((skip+1)); return; fi
            if curl -fsSL --retry 3 -o "$out" "$url"; then
              size=$(stat -c%s "$out")
              if [ "$size" -lt 20000 ]; then
                echo "FAIL  $out too small ($size bytes)"; rm -f "$out"; fail=$((fail+1))
              else
                echo "ok    $out ($size bytes)"; ok=$((ok+1))
              fi
            else
              echo "FAIL  $slug download"; fail=$((fail+1))
            fi
          }
          fetch "thurlestone-beach" "https://static.wixstatic.com/media/9dfbf6_e41dcf27c838404fa8cb94a178c5500d~mv2.jpg/v1/fit/w_1920,h_1440,al_c,q_90/9dfbf6_e41dcf27c838404fa8cb94a178c5500d~mv2.jpg"
          fetch "east-head" "https://static.wixstatic.com/media/9dfbf6_34d809a3277945a38a7c9c1208ce144a~mv2.jpg/v1/fit/w_1920,h_1440,al_c,q_90/9dfbf6_34d809a3277945a38a7c9c1208ce144a~mv2.jpg"
