          fetch "charmouth" "https://static.wixstatic.com/media/9dfbf6_9405e2a6e3364c00a3088bd172101139~mv2.jpg/v1/fit/w_1920,h_1440,al_c,q_90/9dfbf6_9405e2a6e3364c00a3088bd172101139~mv2.jpg"
          fetch "lusty-glaze" "https://static.wixstatic.com/media/9dfbf6_afd163b3f8634078bcba1455d1d344b7~mv2.jpg/v1/fit/w_1920,h_1440,al_c,q_90/9dfbf6_afd163b3f8634078bcba1455d1d344b7~mv2.jpg"
          fetch "sussex-light" "https://static.wixstatic.com/media/9dfbf6_dbd6db1cdba144e1b9c88bcafdd176ad~mv2.jpg/v1/fit/w_1920,h_1440,al_c,q_90/9dfbf6_dbd6db1cdba144e1b9c88bcafdd176ad~mv2.jpg"
          fetch "ravilious-2" "https://static.wixstatic.com/media/9dfbf6_a77f8cbdde984c50af999a0a41d02a30~mv2.jpg/v1/fit/w_1920,h_1440,al_c,q_90/9dfbf6_a77f8cbdde984c50af999a0a41d02a30~mv2.jpg"
