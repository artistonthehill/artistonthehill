          echo "----"
          echo "downloaded $ok, skipped $skip, failed $fail"
          if [ "$fail" -gt 0 ]; then exit 1; fi

      - name: Commit
        run: |
          git config user.name  "wix-migration"
          git config user.email "actions@github.com"
          git add images/
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Bring Wix-hosted paintings home into images/"
          git push
