<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script>
// No API key, no billing, no Google Cloud. Map renders as soon as paintings.json loads.
// Fetch paintings.json — cache-busting so new uploads appear immediately.
fetch('paintings.json?v=' + Date.now())
  .then(r => r.json())
  .then(data => initMap(data))
  .catch(err => console.error('Could not load paintings.json:', err));

function initMap(paintingsData) {
  // Deep-linkable regions: map.html?view=greece opens zoomed to the Ionian, etc.
  const REGIONS = {
    greece:  { center: [38.62, 20.72], zoom: 10 },  // Ionian — Lefkada/Meganisi/Ithaca
    ionian:  { center: [38.62, 20.72], zoom: 10 },
    devon:   { center: [50.24, -3.77], zoom: 11 },
    cornwall:{ center: [50.16, -5.02], zoom: 10 },
    thames:  { center: [51.52, -0.92], zoom: 11 },
    sussex:  { center: [50.82, -0.05], zoom: 10 }
  };
  const requestedView = new URLSearchParams(location.search).get('view');
  const region = REGIONS[(requestedView || '').toLowerCase()];
  const map = L.map('map', { scrollWheelZoom: true }).setView(region ? region.center : [52.0, -2.0], region ? region.zoom : 6);

  // Light, muted basemap (matches the brand far better than Google's default)
  const baseMap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxNativeZoom: 16, maxZoom: 19,
    attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    subdomains: 'abcd', maxZoom: 19
  }).addTo(map);

  // Free satellite imagery (no key) — keeps the Map / Satellite toggle you had
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Imagery &copy; Esri', maxZoom: 19
  });

  L.control.layers({ 'Map': baseMap, 'Satellite': satellite }, null, { position: 'topright' }).addTo(map);

  const ukBounds = [];

  // Cluster overlapping pins (Spilia, Henley etc). Tap a numbered badge to fan the pins out.
  // Falls back to plain pins if the clustering library fails to load — the map must never die.
  const clusterGroup = (typeof L.markerClusterGroup === 'function') ? L.markerClusterGroup({
    maxClusterRadius: 34,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    spiderLegPolylineOptions: { weight: 1.2, color: '#8b6f47', opacity: 0.6 },
    iconCreateFunction: function (cluster) {
      return L.divIcon({
        html: '<div style="background:#8b6f47;color:#fff;border:2px solid #fff;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;font-size:0.78rem;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,0.3);">' + cluster.getChildCount() + '</div>',
        className: '', iconSize: [32, 32]
      });
    }
  }) : L.layerGroup();

  paintingsData.forEach(p => {
    const isUK = p.lat > 49 && p.lat < 62 && p.lng > -9 && p.lng < 2.5;
    if (isUK) ukBounds.push([p.lat, p.lng]);
    const pinColor = p.sold ? '#9e9e9e' : '#8b6f47';
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: 8, fillColor: pinColor, fillOpacity: 0.9, color: '#ffffff', weight: 2
    });
    clusterGroup.addLayer(marker);
    marker.bindTooltip(p.title);

    const viewParams = new URLSearchParams({ img: p.img || '', title: p.title, meta: p.size, price: p.sold ? 'Sold' : p.price, back: 'map.html' });
    if (p.prints) viewParams.set('prints', p.prints);
    const viewUrl = 'painting-view.html?' + viewParams.toString();
    const imgHtml = p.img ? '<a href="' + viewUrl + '"><img class="iw-img" src="' + p.img + '" alt="' + p.title + '" style="cursor:pointer;" title="Click to view full size"></a>' : '';
    const priceHtml = p.sold
      ? '<div class="iw-price" style="font-size:0.8rem;"><span style="text-decoration:line-through;opacity:0.4;">' + p.price + '</span> <span style="background:#1a1714;color:#fff;font-size:0.62rem;letter-spacing:0.12em;padding:2px 6px;font-family:Arial,sans-serif;">SOLD</span></div>'
      : '<div class="iw-price">' + p.price + '</div>';
    // Every popup gets a one-tap WhatsApp route with the painting title prefilled.
    const waText = p.sold
      ? 'Hello Tony, I saw ' + p.title + ' on your map — could you paint something similar for me?'
      : 'Hello Tony, I am interested in ' + p.title + ' (' + p.price + ').';
    const waBtn = '<a class="iw-btn" href="https://wa.me/447880601709?text=' + encodeURIComponent(waText) + '" target="_blank" style="background:#8b6f47;">' + (p.sold ? 'Commission similar via WhatsApp' : 'Enquire via WhatsApp') + '</a>';
    const actionBtns = p.sold && p.prints
      ? '<a class="iw-btn" href="' + p.prints + '" target="_blank">Order a print →</a>' + waBtn
      : '<a class="iw-btn" href="' + viewUrl + '" style="margin-bottom:6px;">View painting →</a>' + waBtn;
    marker.bindPopup('<div class="iw-wrap">' + imgHtml + '<div class="iw-title">' + p.title + '</div><div class="iw-size">' + p.size + '</div>' + priceHtml + actionBtns + '</div>', { maxWidth: 250, minWidth: 220 });
  });

  map.addLayer(clusterGroup);

  if (ukBounds.length) map.fitBounds(ukBounds, { padding: [50, 50] });

  // Insurance for mobile: recalc size once layout settles
  setTimeout(() => map.invalidateSize(), 0);
}
</script>
