<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tony Parsons — Artist on the Hill</title>
<meta property="og:title" content="Tony Parsons — Artist on the Hill">
<meta property="og:description" content="Paintings made outdoors, on the spot, in one sitting. Every one pinned where the easel stood.">
<meta property="og:type" content="website">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WE9VCP47Q8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WE9VCP47Q8');
  </script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{--linen:#FAF7F0;--mount:#FFFEFA;--ink:#232323;--soft:#6B655B;--teal:#6FA8A1;--hair:#E7E1D3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--linen);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
    font-size:17px;line-height:1.65}
  .page{max-width:640px;margin:0 auto;padding:36px 20px 70px}
  .mark{text-align:center;margin-bottom:30px}
  .mark span{display:inline-block;background:var(--teal);color:#FDFCF8;
    font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;font-size:12px;
    letter-spacing:.34em;padding:10px 16px 10px 20px}
  .hero{display:block;background:var(--mount);padding:20px;text-decoration:none;color:var(--ink);
    box-shadow:0 1px 0 var(--teal), 0 14px 34px rgba(35,35,35,.09);margin-bottom:14px}
  .hero img{width:100%;display:block}
  #hero{margin-bottom:26px}
  .hero .cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px}
  .hero .cap .t{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:22px}
  .hero .cap .p{font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;font-size:13.5px;color:var(--soft)}
  .strap{color:var(--soft);text-align:center;max-width:46ch;margin:26px auto 34px;font-size:16.5px}
  .door{display:flex;align-items:center;gap:18px;background:var(--mount);
    padding:20px 22px;box-shadow:0 1px 0 var(--teal);text-decoration:none;color:var(--ink);
    margin-bottom:14px}
  .door:hover{background:#FDFAF2}
  .door svg{flex:0 0 84px}
  .door .t{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:24px;line-height:1.15}
  .door .s{color:var(--soft);font-size:15px;margin-top:5px}
  .foot{text-align:center;color:var(--soft);font-size:13.5px;margin-top:44px;
    font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;line-height:1.7}
  a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  .door.pic{display:block;padding:0;overflow:hidden;cursor:pointer;
    box-shadow:0 1px 0 var(--teal), 0 8px 22px rgba(35,35,35,.12);
    transition:box-shadow .15s ease, transform .15s ease}
  .door.pic:hover,.door.pic:active{transform:translateY(-2px);
    box-shadow:0 1px 0 var(--teal), 0 12px 30px rgba(35,35,35,.16)}
  .door.pic .t::after{content:"\2192";font-family:Georgia,serif;font-style:normal;
    color:var(--teal);margin-left:10px;font-size:20px}
  .door.pic img{width:100%;display:block}
  .door.pic .dt{display:block;padding:16px 20px 18px}
  .door.pic .t{display:block}
  .door.pic .s{display:block;margin-top:6px}
</style>
</head>
<body>
<div class="page">
  <div class="mark"><span>TONY / PARSONS</span></div>

  <a class="hero" id="hero" href="gallery-v2.html" style="display:none">
    <img id="heroImg" src="" alt="">
    <span class="cap"><span class="t" id="heroTitle"></span><span class="p" id="heroPrice"></span></span>
  </a>

    <a class="door pic" href="map.html">
    <img src="door-map.jpg" alt="" loading="lazy">
    <span class="dt"><span class="t">The map</span>
    <span class="s">Every painting, pinned where the easel stood.</span></span>
  </a>

  <a class="door pic" href="catalogue-v2.html">
    <img src="door-own.jpg" alt="" loading="lazy">
    <span class="dt"><span class="t">A catalogue of your own</span>
    <span class="s">Tell me what you love and where you are &mdash; I&rsquo;ll send a PDF,
    including work not shown here.</span></span>
  </a>

  <div class="foot">Sky Arts &middot; the ROI and RSMA at the Mall Galleries &middot; collections of British Royalty<br>
  and of institutions across Europe</div>
</div>

<script>
fetch('paintings.json').then(r=>r.json()).then(list=>{
  const pool=list.filter(x=>!x.sold&&x.img&&/80\s*[x\u00d7]\s*30/i.test(x.size||''));
  const p=pool.length?pool[Math.floor(Math.random()*pool.length)]
        :(list.find(x=>!x.sold)||list[0]);
  if(!p) return;
  document.getElementById('heroImg').src=p.img;
  document.getElementById('heroImg').alt=p.title;
  document.getElementById('heroTitle').textContent=p.title;
  document.getElementById('heroPrice').textContent=p.sold?'Sold':(p.price||'');
  const h=document.getElementById('hero');
  h.href='painting-v2.html?p='+encodeURIComponent(p.id);
  h.style.display='block';
}).catch(()=>{});
</script>
</body>
</html>
