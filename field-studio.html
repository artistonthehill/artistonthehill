<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Field Studio — Artist on the Hill</title>
<style>
  :root{
    --gold:#B8963E; --cream:#f5f2ed; --dark:#1a1a1a; --line:#e2dac9; --line2:#e8e1d4;
    --muted:#6b6357; --good:#1f7a5a; --warn:#b23a2e; --card:#fffdf9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--cream);color:var(--dark);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px}
  h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif}
  .bar{position:sticky;top:0;z-index:10;background:var(--dark);color:var(--cream);
    padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold);
    padding-top:max(14px,env(safe-area-inset-top))}
  .bar h1{margin:0;font-size:1.15rem;font-weight:600;letter-spacing:.3px;flex:1}
  .bar button{background:transparent;border:0;color:var(--cream);font-size:.95rem;padding:6px 4px}
  .bar .gold{color:var(--gold);font-weight:700}
  .wrap{max-width:640px;margin:0 auto;padding:16px 16px 90px}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(0,0,0,.03)}
  label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:10px 0 4px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:1rem;background:#fff;color:var(--dark);font-family:inherit}
  textarea{min-height:120px;line-height:1.45}
  textarea.msgbox{min-height:140px;background:#fffefb}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;font-size:1rem;font-weight:700;
    letter-spacing:.3px;background:var(--gold);color:#fff;text-align:center;text-decoration:none;margin-top:10px}
  .btn.dark{background:var(--dark)} .btn.ghost{background:#fff;color:var(--dark);border:1px solid var(--line)}
  .btn.wa{background:#25D366} .btn.mail{background:#2b6cb0} .btn.sm{padding:10px;font-size:.9rem;margin-top:0}
  .btn:disabled{opacity:.5}
  .toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .tog{flex:1 1 auto;min-width:46%;padding:11px 8px;border:1.5px solid var(--line);border-radius:9px;background:#fff;
    color:var(--muted);font-size:.85rem;font-weight:700;text-align:center}
  .tog.on{background:var(--gold);border-color:var(--gold);color:#fff}
  .tog.on.good{background:var(--good);border-color:var(--good)}
  .tog.on.dk{background:var(--dark);border-color:var(--dark)}
  .seg{display:flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{flex:1;padding:11px;border:0;background:#fff;color:var(--muted);font-weight:700;font-size:.85rem}
  .seg button.on{background:var(--dark);color:#fff}
  .plist{list-style:none;padding:0;margin:0}
  .pitem{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--card);border:1px solid var(--line2);
    border-radius:12px;margin-bottom:10px}
  .pitem .th{width:52px;height:52px;border-radius:8px;background:#eee center/cover;flex:0 0 auto;border:1px solid var(--line)}
  .pitem .meta{flex:1;min-width:0}
  .pitem .meta b{font-family:Georgia,serif;font-size:1.05rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pitem .meta span{font-size:.78rem;color:var(--muted)}
  .pill{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:10px;background:#ece5d6;color:#6a6044}
  .pill.map{background:#dfeee6;color:#1f7a5a}.pill.priv{background:#e7e0f0;color:#5a4b7a}.pill.sold{background:#1a1a1a;color:#fff}
  .pill.crm{background:#dfeee6;color:#1f7a5a}.pill.live{background:#dfeee6;color:#1f7a5a}.pill.draft{background:#f3e7c9;color:#8a6d1f}
  .lead{border:1px solid var(--line2);border-radius:10px;padding:12px;margin-top:10px;background:#fffefb}
  .lead.prio{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,150,62,.18)}
  .lead.synced{opacity:.5}
  .codetag{margin:6px 0;font-size:.8rem;color:var(--muted)} .codetag b{color:var(--dark);letter-spacing:1px}
  .linktag{margin:8px 0 0;font-size:.72rem;color:var(--muted);word-break:break-all;background:#f4efe6;border:1px dashed var(--line);border-radius:8px;padding:8px}
  .linktag b{color:var(--good)}
  .muted{color:var(--muted);font-size:.82rem}
  .save{font-size:.72rem;color:var(--good);text-align:right;margin:-4px 2px 8px}
  .soldban{background:#1a1a1a;color:#fff;text-align:center;padding:8px;border-radius:8px;font-weight:700;letter-spacing:2px;margin-bottom:12px}
  .pubbox{border:1px solid var(--line2);border-radius:12px;padding:14px;margin-bottom:12px;background:#fff}
  .pubbox.live{border-color:#a9d3bf;background:#f2f8f4}
  .fab{position:fixed;right:16px;bottom:max(18px,env(safe-area-inset-bottom));z-index:20;background:var(--gold);color:#fff;
    border:0;border-radius:30px;padding:15px 22px;font-size:1rem;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.22)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}
  .empty h2{color:var(--dark)} hr{border:0;border-top:1px solid var(--line2);margin:14px 0}
  .hd{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px}
  .hd h3{margin:0;font-size:1.05rem} .x{color:var(--warn);background:none;border:0;font-size:.8rem;font-weight:700}
  .imgwrap img{width:100%;border-radius:10px;border:1px solid var(--line);margin-top:6px}
  small.note{display:block;color:var(--muted);font-size:.72rem;margin-top:4px}
  .stepnote{font-size:.82rem;margin-top:8px}
  .stepnote.busy{color:var(--muted)} .stepnote.done{color:var(--good)} .stepnote.err{color:var(--warn)}
</style>
</head>
<body>
<div class="bar">
  <button id="back" style="display:none">‹ Back</button>
  <h1 id="title">Field Studio</h1>
  <button id="settingsBtn" class="gold">⚙</button>
</div>
<div class="wrap" id="app"></div>
<button class="fab" id="fab">+ Painting</button>

<script>
/* ---------- storage (IndexedDB, local-first) ---------- */
const DB="aoth-field", STORE="paintings";
let _db;
function db(){return new Promise((res,rej)=>{if(_db)return res(_db);
  const r=indexedDB.open(DB,1);
  r.onupgradeneeded=e=>{e.target.result.createObjectStore(STORE,{keyPath:"id"});};
  r.onsuccess=e=>{_db=e.target.result;res(_db);};r.onerror=e=>rej(e);});}
async function put(p){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,"readwrite");
  t.objectStore(STORE).put(p);t.oncomplete=()=>res();t.onerror=rej;});}
async function all(){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,"readonly");
  const rq=t.objectStore(STORE).getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=rej;});}
async function del(id){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,"readwrite");
  t.objectStore(STORE).delete(id);t.oncomplete=()=>res();t.onerror=rej;});}

/* ---------- settings (localStorage) ---------- */
const S=JSON.parse(localStorage.getItem("aoth-settings")||"{}");
const defaults={artist:"Tony",viewBase:"https://www.artistonthehill.co.uk/v/",vat:20,cc:"44",months:23};
const settings=Object.assign({},defaults,S);
function saveSettings(){localStorage.setItem("aoth-settings",JSON.stringify(settings));}

/* ---------- GitHub (publishes each painting's private view) ---------- */
const GH_OWNER="artistonthehill", GH_REPO="artistonthehill", GH_BRANCH="main";
function getToken(){return localStorage.getItem("gh_token_aoth");}
function needToken(){
  let t=getToken();
  if(t)return t;
  t=prompt("One-time setup: paste your GitHub token (starts ghp_ or github_pat_).\n\nThis is the same token your Upload app uses — it lets Field Studio publish private views to your website. Stored only on this phone.");
  if(t){t=t.trim();localStorage.setItem("gh_token_aoth",t);return t;}
  return null;
}
async function ghGet(path){
  const r=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}`,
    {headers:{Authorization:"token "+getToken(),Accept:"application/vnd.github.v3+json"}});
  if(!r.ok)throw new Error("GET "+r.status);
  return r.json();
}
async function ghPut(path,content,sha,message){
  const body={message,content,branch:GH_BRANCH};if(sha)body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`,
    {method:"PUT",headers:{Authorization:"token "+getToken(),Accept:"application/vnd.github.v3+json","Content-Type":"application/json"},
     body:JSON.stringify(body)});
  if(!r.ok)throw new Error("PUT "+r.status+" "+await r.text());
  return r.json();
}
function b64utf8(str){const bytes=new TextEncoder().encode(str);let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin);}

/* ---------- Cloudinary (unsigned field-photo upload) ---------- */
const CLOUD="dcy9llfe4", PRESET="field-studio";
async function uploadToCloudinary(dataURL){
  const blob=await (await fetch(dataURL)).blob();
  const fd=new FormData();fd.append("file",blob);fd.append("upload_preset",PRESET);
  const res=await fetch("https://api.cloudinary.com/v1_1/"+CLOUD+"/image/upload",{method:"POST",body:fd});
  if(!res.ok)throw new Error("upload "+res.status);
  const j=await res.json();return j.secure_url;
}

const COUNTRIES=[["UK","44"],["Ireland","353"],["USA/Canada","1"],["France","33"],["Germany","49"],
["Spain","34"],["Italy","39"],["Netherlands","31"],["Belgium","32"],["Switzerland","41"],["Austria","43"],
["Portugal","351"],["Greece","30"],["Sweden","46"],["Norway","47"],["Denmark","45"],["Australia","61"],
["New Zealand","64"],["UAE","971"],["South Africa","27"]];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s), app=$("#app");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"£"+Number(n).toLocaleString("en-GB");
const slug=s=>(s||"").replace(/[^a-z]/gi,"").toUpperCase();
const kebab=s=>(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
function gross(p){return parseFloat(p.price)||0;}
function priceLine(p){if(!p.price)return"";return money(p.price);}
function monthly(p){const amt=gross(p);if(!amt)return 0;return Math.round(amt/settings.months/5)*5;}

/* per-person code: BASE-PER  (BASE from painting code/title, PER from name) */
function makeCode(p,l){
  let base=slug(p.code)||slug(p.title).slice(0,4)||"VIEW";
  let per=slug(l.name).slice(0,3);
  if(!per)per="G"+(((p.leads||[]).indexOf(l))+1);
  return base+"-"+per;
}
/* stable per-painting slug for the published file + link */
function ensureSlug(p){
  if(p.slug)return p.slug;
  let base=kebab(p.code||p.title||"view").slice(0,40)||"view";
  p.slug=base+"-"+Math.random().toString(36).slice(2,5);
  return p.slug;
}
/* short link: viewBase?p=<painting>&w=<person> */
function roomLink(p,l){
  ensureSlug(p);
  const code=(l.code||makeCode(p,l)).toLowerCase();
  return (settings.viewBase||"")+"?p="+encodeURIComponent(p.slug)+"&w="+encodeURIComponent(code);
}
/* the JSON the /v/ page reads */
function buildPayload(p){
  const pl={t:p.title||"",s:p.size||"",p:p.price||"",v:!!p.price,f:!!p.framed,
    d:p.delivery||"",sold:!!p.sold,w:(p.waiting!==false)&&!p.sold,m:monthly(p),pr:true,
    updated:new Date().toISOString().slice(0,10)};
  if(p.imageURL)pl.i=p.imageURL;
  if(p.gillan)pl.g=p.gillan;
  return pl;
}

let state={view:"list",pid:null,paintings:[],lastExport:null};
let savedTimer;
function flagSaved(){const e=$("#savedFlag");if(e){e.textContent="✓ saved";clearTimeout(savedTimer);
  savedTimer=setTimeout(()=>{if(e)e.textContent="";},1200);}}
async function persist(){const p=current();if(p){await put(p);flagSaved();}}
function current(){return state.paintings.find(x=>x.id===state.pid);}

/* ---------- publish the private view ---------- */
async function publishView(){
  const p=current();if(!p)return;
  if(!p.title)return alert("Give the painting a title first.");
  if(!needToken())return;
  ensureSlug(p);
  if(!p.imageURL && !confirm("The photo hasn't uploaded yet, so the view will show a blank image. Publish anyway?"))return;
  const noteEl=$("#pub-note");
  const set=(cls,msg)=>{if(noteEl){noteEl.className="stepnote "+cls;noteEl.textContent=msg;}};
  set("busy","Publishing your private view…");
  try{
    const path="v/data/"+p.slug+".json";
    let sha=null;try{sha=(await ghGet(path)).sha;}catch(e){}
    await ghPut(path,b64utf8(JSON.stringify(buildPayload(p),null,2)),sha,"Publish private view: "+p.title);
    p.published=true;p.publishedAt=Date.now();await persist();
    set("done","✓ Live. Your links now work — updates in ~1 min.");
    renderPainting();
  }catch(e){
    set("err","Couldn't publish ("+e.message+"). Check signal / token, then try again.");
  }
}

/* ---------- message (short, editable per person) ---------- */
function buildDefaultMessage(p,l){
  const first=(l.name||"there").split(" ")[0];
  let opener;
  if(l.greeting==="you")       opener="Hi "+first+" — it was great fun to include you in the painting today.";
  else if(l.greeting==="kids") opener="Hi "+first+" — it was great to include your kids in the painting today.";
  else                         opener="Hi "+first+" — great to meet you today.";
  return opener+"\n\nAs promised, here's your private view of the painting. Everything's on the page — a few ways to own it, a print option, and a sign-up for my newsletter if you fancy it. Have a wander round the rest of my site while you're there.";
}
function leadMessage(l,p){return (l.message!=null?l.message:buildDefaultMessage(p,l));}

function waNumber(l){const cc=(l.cc||settings.cc||"44").replace(/\D/g,"");
  const n=(l.wa||"").replace(/\D/g,"").replace(/^0+/,"");return cc+n;}
function fireWA(l){const p=current();
  if(!p.published&&!confirm("You haven't published this painting's private view yet — the link won't work until you do (use the Publish button up top). Send anyway?"))return;
  if(p.photo&&!p.imageURL&&!confirm("The photo hasn't finished uploading (likely no signal). Send without it? Tap Cancel to retry the upload first."))return;
  if(!l.code)l.code=makeCode(p,l);
  const body=leadMessage(l,p)+"\n\n"+roomLink(p,l);
  l.fired=true;persist();window.open("https://wa.me/"+waNumber(l)+"?text="+encodeURIComponent(body),"_blank");}
function fireMail(l){const p=current();
  if(!p.published&&!confirm("You haven't published this painting's private view yet — the link won't work until you do. Send anyway?"))return;
  if(!l.code)l.code=makeCode(p,l);
  if(p.photo&&!p.imageURL&&!confirm("The photo hasn't finished uploading (likely no signal). Send without it? Tap Cancel to retry the upload first."))return;
  const sub=encodeURIComponent((p.title||"Your painting")+" — a private view");
  const body=encodeURIComponent(leadMessage(l,p)+"\n\n"+roomLink(p,l));l.fired=true;persist();
  window.location.href="mailto:"+encodeURIComponent(l.email)+"?subject="+sub+"&body="+body;}

/* ---------- views ---------- */
function go(view,pid){state.view=view;if(pid!==undefined)state.pid=pid;render();window.scrollTo(0,0);}

async function render(){
  state.paintings=await all();
  $("#back").style.display=state.view==="list"?"none":"inline";
  $("#settingsBtn").style.display=state.view==="list"?"inline":"none";
  $("#fab").style.display=state.view==="list"?"block":"none";
  if(state.view==="list")return renderList();
  if(state.view==="settings")return renderSettings();
  if(state.view==="painting")return renderPainting();
}

function renderList(){
  $("#title").textContent="Field Studio";
  const ps=[...state.paintings].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  if(!ps.length){app.innerHTML=`<div class="empty"><h2 class="serif">Nothing logged yet</h2>
    <p>Tap <b>+ Painting</b> when you set up the easel. Everything saves to this phone — no signal needed.</p></div>`;return;}
  app.innerHTML=`<ul class="plist">`+ps.map(p=>{
    const leads=(p.leads||[]).length;const prio=(p.leads||[]).filter(l=>l.priority).length;
    const dest=p.sold?'<span class="pill sold">SOLD</span> ':(p.published?'<span class="pill live">Live</span> ':'<span class="pill draft">Draft</span> ');
    return `<li class="pitem" onclick="go('painting','${p.id}')">
      <div class="th" style="${p.photo?`background-image:url('${p.photo}')`:''}"></div>
      <div class="meta"><b>${esc(p.title)||"Untitled"}</b>
      <span>${dest}· ${leads} on list${prio?` · <b style="color:var(--gold)">${prio} priority</b>`:""}${p.price?` · ${esc(priceLine(p))}`:""}</span></div>
      <div style="color:var(--muted)">›</div></li>`;}).join("")+`</ul>
    <button class="btn ghost" onclick="go('settings')">Settings &amp; push to CRM</button>`;
}

function renderPainting(){
  const p=current();if(!p)return go("list");
  (p.leads||[]).forEach(l=>{if(!l.id)l.id=uid();});
  $("#title").textContent=p.title||"New painting";
  const link=p.slug?(settings.viewBase+"?p="+p.slug):"";
  app.innerHTML=`
  <div class="save" id="savedFlag"></div>
  ${p.sold?`<div class="soldban">SOLD${p.soldAt?" · "+new Date(p.soldAt).toLocaleDateString('en-GB'):""}</div>`:""}
  <div class="card">
    <label>Title / what & where</label>
    <input id="f-title" placeholder="e.g. The George, Fordingbridge" value="${esc(p.title)}">
    <label>Base private view code (optional — used in the link)</label>
    <input id="f-code" placeholder="e.g. FORD" value="${esc(p.code)}" style="text-transform:uppercase">
    <div class="row"><div><label>Size</label><input id="f-size" placeholder="60×42cm" value="${esc(p.size)}"></div>
      <div><label>Price (inc VAT £)</label><input id="f-price" type="number" inputmode="decimal" placeholder="2300" value="${esc(p.price)}"></div></div>
    <div class="toggles">
      <button class="tog ${p.framed?"on":""}" onclick="toggle('framed')">${p.framed?"✓ Framed to taste":"Unframed"}</button>
      <button class="tog ${p.waiting!==false?"on good":""}" onclick="toggle('waiting')">${p.waiting!==false?"✓ Waiting Room plan":"No payment plan"}</button>
    </div>
    <label>Delivery</label>
    <div class="seg">
      <button class="${p.delivery==="hand"?"on":""}" onclick="setField('delivery','hand')">By hand</button>
      <button class="${p.delivery==="crate"?"on":""}" onclick="setField('delivery','crate')">Custom crate</button>
    </div>
    <label>Photo of the piece (choose the best from your roll — it uploads automatically)</label>
    <input type="file" accept="image/*" onchange="addPhoto(this)">
    ${p.photo?`<div class="imgwrap"><img src="${p.photo}"></div>`:""}
    ${uploadStatusHTML(p)}
    <label>Room image link (auto-filled on upload — or paste your own)</label>
    <input id="f-img" placeholder="https://res.cloudinary.com/..." value="${esc(p.imageURL)}">
    <hr>
    <label>Status</label>
    <div class="toggles">
      <button class="tog ${p.sold?"on dk":""}" onclick="toggleSold()">${p.sold?"★ Sold — tap to undo":"Mark as sold"}</button>
    </div>
    <label>Gillan Gallery print link (add any time)</label>
    <input id="f-gillan" placeholder="https://thegillangallery.com/..." value="${esc(p.gillan)}">
    <small class="note">Publish again after changing price, sold status or print link to update every view you've sent.</small>
  </div>

  <div class="pubbox ${p.published?"live":""}">
    <button class="btn ${p.published?"ghost":""}" onclick="publishView()">${p.published?"✓ Published — republish to update":"Publish private view"}</button>
    ${link?`<div class="linktag">Live at: <b>${esc(link)}</b></div>`:`<small class="note">Publishing puts the painting on your website so the links work. Do this once you've got signal.</small>`}
    <div class="stepnote" id="pub-note"></div>
  </div>

  <div class="hd"><h3 class="serif">People on the list</h3><span class="muted">${(p.leads||[]).length} — hidden from each other</span></div>
  <div id="leads">${(p.leads||[]).map((l,i)=>leadCard(l,i)).join("")}</div>
  <button class="btn dark" onclick="addLead()">+ Add someone I've spoken to</button>
  <button class="btn ghost" onclick="if(confirm('Delete this painting and its list?')){delPainting()}">Delete painting</button>
  `;
  bindText("f-title","title");bindText("f-code","code",true);
  bindText("f-size","size");bindText("f-price","price");bindText("f-gillan","gillan");bindText("f-img","imageURL");
}

function leadCard(l,i){
  const p=current();const hasWA=(l.wa||"").trim().length>0;const hasMail=(l.email||"").trim().length>0;
  const opts=COUNTRIES.map(c=>`<option value="${c[1]}" ${(l.cc||settings.cc)===c[1]?"selected":""}>${c[0]} +${c[1]}</option>`).join("");
  const code=l.code||makeCode(p,l);
  return `<div class="lead ${l.priority?"prio":""} ${l.synced?"synced":""}" id="lead-${i}">
    ${l.synced?'<span class="pill crm">✓ in CRM</span>':''}
    <input placeholder="Name" value="${esc(l.name)}" oninput="leadField(${i},'name',this.value)">
    <div class="codetag">Their tracking tag: <b>${esc(code.toLowerCase())}</b></div>
    <div class="row" style="margin-top:2px">
      <select style="flex:0 0 38%" onchange="leadField(${i},'cc',this.value)">${opts}</select>
      <input style="flex:1" type="tel" inputmode="tel" placeholder="WhatsApp number" value="${esc(l.wa)}" oninput="leadField(${i},'wa',this.value)">
    </div>
    <input style="margin-top:8px" type="email" inputmode="email" placeholder="Email" value="${esc(l.email)}" oninput="leadField(${i},'email',this.value)">
    <label>Quick opener (rewrites the message below)</label>
    <div class="seg">
      <button class="${(l.greeting||'met')==='met'?'on':''}" onclick="leadSet(${i},'greeting','met')">Met you</button>
      <button class="${l.greeting==='you'?'on':''}" onclick="leadSet(${i},'greeting','you')">In picture</button>
      <button class="${l.greeting==='kids'?'on':''}" onclick="leadSet(${i},'greeting','kids')">Kids in pic</button>
    </div>
    <label>Message to ${esc((l.name||"them").split(" ")[0])} — edit freely (the link is added automatically)</label>
    <textarea class="msgbox" oninput="leadMsg(${i},this.value)">${esc(leadMessage(l,p))}</textarea>
    <div class="toggles">
      <button class="tog ${l.priority?"on":""}" onclick="leadToggle(${i},'priority')">${l.priority?"★ Priority":"Priority?"}</button>
      <button class="tog ghost" onclick="resetMsg(${i})" style="color:var(--muted)">Reset text</button>
    </div>
    <div class="row" style="margin-top:8px">
      ${hasWA?`<button class="btn wa sm" onclick="fireWA(current().leads[${i}])">${l.fired?"Re-send":"Send"} WhatsApp</button>`:""}
      ${hasMail?`<button class="btn mail sm" onclick="fireMail(current().leads[${i}])">${l.fired?"Re-send":"Send"} Email</button>`:""}
      ${(!hasWA&&!hasMail)?`<span class="muted" style="align-self:center">Add a number or email to send</span>`:""}
    </div>
    <button class="x" style="margin-top:8px" onclick="delLead(${i})">remove</button>
  </div>`;
}

/* ---------- field binding ---------- */
function bindText(id,key,upper){const el=document.getElementById(id);if(!el)return;
  el.oninput=()=>{let v=el.value;if(upper)v=v.toUpperCase();current()[key]=v;persist();
    if(key==="title")$("#title").textContent=v||"New painting";};}
function setField(k,v){current()[k]=v;persist();renderPainting();}
function toggle(k){const p=current();p[k]=(k==="waiting")?(p.waiting===false?true:false):!p[k];persist();renderPainting();}
function toggleSold(){const p=current();p.sold=!p.sold;if(p.sold)p.soldAt=Date.now();persist();renderPainting();}
function leadField(i,k,v){const p=current();p.leads[i][k]=v;
  if(k==="name"){p.leads[i].code="";
    const ct=document.querySelector("#lead-"+i+" .codetag b");if(ct)ct.textContent=makeCode(p,p.leads[i]).toLowerCase();
    if(p.leads[i].message==null){const ta=document.querySelector("#lead-"+i+" .msgbox");if(ta)ta.value=buildDefaultMessage(p,p.leads[i]);}}
  persist();}
function leadMsg(i,v){const p=current();p.leads[i].message=v;persist();}
function resetMsg(i){const p=current();p.leads[i].message=null;persist();renderPainting();}
function leadToggle(i,k){const p=current();p.leads[i][k]=!p.leads[i][k];persist();renderPainting();}
function leadSet(i,k,v){const p=current();p.leads[i][k]=v;
  if(k==="greeting")p.leads[i].message=buildDefaultMessage(p,p.leads[i]);
  persist();renderPainting();}
function addLead(){const p=current();p.leads=p.leads||[];p.leads.push({id:uid(),cc:settings.cc});persist();renderPainting();
  setTimeout(()=>{const e=document.getElementById("lead-"+(p.leads.length-1));if(e)e.scrollIntoView({behavior:"smooth",block:"center"});},50);}
function delLead(i){const p=current();if(!confirm("Remove "+(p.leads[i].name||"this person")+"?"))return;
  p.leads.splice(i,1);persist();renderPainting();}
async function delPainting(){await del(state.pid);go("list");}

/* ---------- photo (downscaled, stored locally) ---------- */
function addPhoto(input){const f=input.files[0];if(!f)return;const pid=state.pid;const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=async()=>{const max=1280;let w=img.width,h=img.height;
    if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}
    const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
    const dataURL=c.toDataURL("image/jpeg",0.82);
    await patchPainting(pid,{photo:dataURL,imageURL:"",uploadState:"uploading"});if(state.pid===pid)await render();
    try{const url=await uploadToCloudinary(dataURL);await patchPainting(pid,{imageURL:url,uploadState:"done"});}
    catch(err){await patchPainting(pid,{uploadState:"pending"});}
    if(state.pid===pid)await render();};img.src=e.target.result;};
  r.readAsDataURL(f);}
async function patchPainting(pid,patch){const arr=await all();const p=arr.find(x=>x.id===pid);if(!p)return;Object.assign(p,patch);await put(p);}
async function retryUpload(){const pid=state.pid;const p=current();if(!p||!p.photo)return;
  await patchPainting(pid,{uploadState:"uploading"});await render();
  try{const url=await uploadToCloudinary(p.photo);await patchPainting(pid,{imageURL:url,uploadState:"done"});}
  catch(e){await patchPainting(pid,{uploadState:"pending"});}
  await render();}
function uploadStatusHTML(p){if(!p.photo)return"";
  if(p.uploadState==="uploading")return'<div class="muted" style="margin-top:6px">Uploading photo…</div>';
  if(p.uploadState==="done"||p.imageURL)return'<div style="margin-top:6px;color:var(--good);font-size:.82rem">✓ Photo uploaded — it\'ll show in the room</div>';
  if(p.uploadState==="pending")return'<div style="margin-top:6px;color:var(--warn);font-size:.82rem">⚠ Photo not uploaded (no signal). <button class="x" style="color:var(--gold)" onclick="retryUpload()">Retry upload</button></div>';
  return"";}

/* ---------- new painting ---------- */
async function newPainting(){const p={id:uid(),createdAt:Date.now(),title:"",loc:"",code:"",
  size:"",price:"",vat:false,framed:true,waiting:true,delivery:"",photo:"",sold:false,gillan:"",imageURL:"",
  slug:"",published:false,leads:[]};await put(p);go("painting",p.id);}

/* ---------- settings, CRM push & backup ---------- */
async function renderSettings(){
  $("#title").textContent="Settings & CRM";
  const ps=await all();const due=unsyncedCount(ps);
  const hasTok=!!getToken();
  app.innerHTML=`<div class="card">
    <label>Your name (signs the messages)</label><input id="s-artist" value="${esc(settings.artist)}">
    <label>Private view base URL</label><input id="s-base" value="${esc(settings.viewBase)}">
    <small class="note">Where the /v/ page lives. Each link is this + the painting + person.</small>
    <div class="row"><div><label>VAT %</label><input id="s-vat" type="number" value="${settings.vat}"></div>
    <div><label>Waiting Room months</label><input id="s-months" type="number" value="${settings.months}"></div></div>
    <button class="btn" onclick="saveSet()">Save settings</button>
  </div>
  <div class="card">
    <h3 class="serif" style="margin-top:0">Website publishing</h3>
    <p class="muted">${hasTok?"✓ GitHub token saved — publishing is ready.":"No GitHub token yet. You'll be asked for it the first time you publish a view."}</p>
    <button class="btn ghost" onclick="setToken()">${hasTok?"Replace GitHub token":"Add GitHub token"}</button>
  </div>
  <div class="card">
    <h3 class="serif" style="margin-top:0">Push to CRM</h3>
    <p class="muted">${due} new ${due===1?"entry":"entries"} waiting to push. Do this on wifi.</p>
    <button class="btn dark" onclick="exportCSV()">1 · Export new entries (CSV)</button>
    <button class="btn ghost" onclick="confirmArchive()">2 · I've put them in Airtable — archive them</button>
    <small class="note">Export gives you only people you haven't pushed yet. Once they're safely in Airtable, archive so they never upload twice.</small>
    <hr>
    <button class="btn ghost" onclick="exportJSON()">Download full backup (JSON)</button>
    <label>Restore from a backup</label>
    <input type="file" accept="application/json" onchange="importJSON(this)">
  </div>`;
}
function setToken(){const t=prompt("Paste your GitHub token (starts ghp_ or github_pat_):");if(t){localStorage.setItem("gh_token_aoth",t.trim());alert("Saved.");go("settings");}}
function saveSet(){settings.artist=$("#s-artist").value;settings.viewBase=$("#s-base").value.trim();
  settings.vat=parseFloat($("#s-vat").value)||20;settings.months=parseInt($("#s-months").value)||23;
  saveSettings();alert("Saved.");go("list");}

function unsyncedCount(ps){let n=0;ps.forEach(p=>{const leads=p.leads||[];
  if(leads.length){n+=leads.filter(l=>!l.synced).length;}else if(!p.synced){n+=1;}});return n;}

function csvCell(v){v=(v==null?"":String(v));return '"'+v.replace(/"/g,'""')+'"';}
async function exportCSV(){const ps=await all();
  const head=["Painting","Location","Base code","Status","Gillan print","Size","Net price",
    "Plus VAT","Gross","Framed","Delivery","Name","Person code","Country code","WhatsApp","Email",
    "Priority","Logged"];
  const rows=[head];const exLeads=[];const exPaints=[];
  ps.forEach(p=>{const when=new Date(p.createdAt).toLocaleString("en-GB");
    const pbase=[p.title,p.loc,p.code,p.sold?"SOLD":(p.published?"Live":"Draft"),p.gillan||"",p.size,p.price,
      p.vat?"Yes":"No",p.vat?gross(p):"",p.framed?"Yes":"No",
      p.delivery==="crate"?"Custom crate":p.delivery==="hand"?"By hand":""];
    const leads=p.leads||[];
    if(!leads.length){if(!p.synced){rows.push(pbase.concat(["","","","","","",when]));exPaints.push(p.id);}}
    else{leads.filter(l=>!l.synced).forEach(l=>{rows.push(pbase.concat([l.name||"",l.code||makeCode(p,l),
      l.cc||"",l.wa||"",l.email||"",l.priority?"PRIORITY":"",when]));
      exLeads.push(p.id+"::"+l.id);});}});
  if(rows.length===1){alert("Nothing new to push — you're all caught up.");return;}
  state.lastExport={leads:exLeads,paints:exPaints};
  dl("field-studio-"+stamp()+".csv","text/csv",rows.map(r=>r.map(csvCell).join(",")).join("\r\n"));
}
async function confirmArchive(){
  if(!state.lastExport){alert("Export the CSV first, then archive once it's safely in Airtable.");return;}
  if(!confirm("Archive everything from the last export? They'll stay on your phone but won't upload again."))return;
  const ps=await all();
  for(const p of ps){let changed=false;
    if(state.lastExport.paints.includes(p.id)){p.synced=true;p.syncedAt=Date.now();changed=true;}
    (p.leads||[]).forEach(l=>{if(state.lastExport.leads.includes(p.id+"::"+l.id)){l.synced=true;l.syncedAt=Date.now();changed=true;}});
    if(changed)await put(p);}
  state.lastExport=null;alert("Archived. Those won't appear in the next push.");go("settings");
}
async function exportJSON(){const ps=await all();dl("field-studio-backup-"+stamp()+".json","application/json",JSON.stringify(ps,null,2));}
function importJSON(input){const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=async e=>{try{const arr=JSON.parse(e.target.result);if(!Array.isArray(arr))throw 0;
    for(const p of arr){if(p&&p.id)await put(p);}alert("Restored "+arr.length+" paintings.");go("list");}
    catch(_){alert("That doesn't look like a Field Studio backup.");}};r.readAsText(f);}
function stamp(){return new Date().toISOString().slice(0,10);}
function dl(name,type,data){const b=new Blob([data],{type});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}

/* ---------- wire up ---------- */
$("#fab").onclick=newPainting;
$("#back").onclick=()=>go("list");
$("#settingsBtn").onclick=()=>go("settings");
window.addEventListener("pagehide",()=>{const p=current();if(p)put(p);});
document.addEventListener("visibilitychange",()=>{if(document.hidden){const p=current();if(p)put(p);}});
render();
</script>
</body>
</html>
