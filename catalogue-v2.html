<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A catalogue of your own — Tony Parsons</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WE9VCP47Q8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WE9VCP47Q8');
  </script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{--linen:#FAF7F0;--mount:#FFFEFA;--ink:#232323;--soft:#6B655B;--teal:#6FA8A1;--hair:#E7E1D3}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--linen);color:var(--ink);font-family:Georgia,'Times New Roman',serif;
    font-size:17px;line-height:1.65}
  .page{max-width:560px;margin:0 auto;padding:36px 22px 70px}
  .mark{text-align:center;margin-bottom:30px}
  .mark a{display:inline-block;background:var(--teal);color:#FDFCF8;text-decoration:none;
    font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;font-size:12px;
    letter-spacing:.34em;padding:10px 16px 10px 20px}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic;
    font-size:34px;line-height:1.1;text-align:center}
  .lead{color:var(--soft);text-align:center;max-width:44ch;margin:14px auto 34px;font-size:16px}
  label{display:block;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;
    font-size:13px;letter-spacing:.06em;color:var(--soft);margin:22px 0 8px}
  input[type=text]{width:100%;background:var(--mount);border:1px solid var(--hair);
    padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);outline:none}
  input:focus{border-color:var(--teal)}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:1px solid var(--hair);background:var(--mount);color:var(--ink);
    padding:10px 17px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;
    font-size:14px;letter-spacing:.03em;cursor:pointer}
  .chip.on{border-color:var(--teal);background:#EDF3F1}
  .send{margin-top:34px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .send button{padding:14px 26px;font-family:'Helvetica Neue',Arial,sans-serif;font-weight:300;
    font-size:14px;letter-spacing:.05em;color:var(--ink);border:1px solid var(--teal);
    background:none;cursor:pointer}
  .send button:hover{background:#F2EDE1}
  .send .quiet{border-color:var(--hair);color:var(--soft)}
  .err{color:#A0522D;font-size:14px;text-align:center;margin-top:12px;min-height:20px}
  .note{color:var(--soft);font-size:14px;text-align:center;margin-top:26px;font-style:italic}
  button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<div class="page">
  <div class="mark"><a href="index-v2.html">TONY / PARSONS</a></div>
  <h1>A catalogue of your own</h1>
  <p class="lead">Tell me what you love and roughly where you are, and I&rsquo;ll send you a
  proper catalogue as a PDF &mdash; including paintings that aren&rsquo;t on the website just now.</p>

  <label for="name">Your first name</label>
  <input type="text" id="name" autocomplete="given-name">

  <label>What should go in it? Choose any</label>
  <div class="chips" id="interests"></div>

  <label for="loc">Where are you? A town or county is plenty — I&rsquo;ll include work painted near you</label>
  <input type="text" id="loc" autocomplete="off" placeholder="e.g. Falmouth, or West Sussex">

  <div class="send">
    <button type="button" id="waBtn">Send my request by WhatsApp</button>
    <button type="button" id="emBtn" class="quiet">By email instead</button>
  </div>
  <div class="err" id="err"></div>
  <p class="note">Your catalogue is usually with you the same day.</p>
</div>

<script>
const ARTIST_WA="447880601709", ARTIST_EM="artistonthehill@gmail.com";
const TRACKER="https://script.google.com/macros/s/AKfycbyat7BaffKYZXnznmS9BH9j9vjYSnxo2Yl3TY1egWuBE_hFSJ4Gr86N8lxYSm6kiP8sjA/exec";
const OPTIONS=['The last few months — everything, sold and all','Greece','Cornwall & Devon','Sussex','Venice','The Alps','The Bahamas','Animals','Boats & harbours','Everything'];
const picked=new Set();
const box=document.getElementById('interests');
OPTIONS.forEach(o=>{
  const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=o;
  b.onclick=()=>{picked.has(o)?picked.delete(o):picked.add(o); b.classList.toggle('on');};
  box.appendChild(b);
});
function ping(event){
  const q=new URLSearchParams({event:event,page:'catalogue-request',who:'site',code:'site',
    ua:navigator.userAgent||'',tz:Intl.DateTimeFormat().resolvedOptions().timeZone||'',
    lang:navigator.language||'',ref:document.referrer||'direct',visits:'1'});
  const i=new Image(); i.src=TRACKER+'?'+q.toString();
}
ping('viewed');
function message(){
  const name=document.getElementById('name').value.trim();
  const loc=document.getElementById('loc').value.trim();
  const err=document.getElementById('err');
  if(!name){err.textContent='Just your first name first — so I know whose catalogue it is.';
    document.getElementById('name').focus();return null;}
  if(!picked.size&&!loc){err.textContent='Choose at least one interest, or tell me where you are.';return null;}
  err.textContent='';
  let m='Hi Tony — I\'d love a catalogue please. I\'m '+name+'.';
  if(picked.size)m+=' Interests: '+[...picked].join(', ')+'.';
  if(loc)m+=' I\'m near '+loc+'.';
  return m;
}
document.getElementById('waBtn').onclick=()=>{const m=message();if(!m)return;
  ping('catalogue-request-wa');
  window.open('https://wa.me/'+ARTIST_WA+'?text='+encodeURIComponent(m),'_blank');};
document.getElementById('emBtn').onclick=()=>{const m=message();if(!m)return;
  ping('catalogue-request-email');
  location.href='mailto:'+ARTIST_EM+'?subject='+encodeURIComponent('A catalogue, please')+
    '&body='+encodeURIComponent(m);};
</script>
</body>
</html>
